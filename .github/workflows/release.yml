name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: linux,   arch: amd64, ext: "",      goos: linux,   goarch: amd64 }
          - { os: darwin,  arch: amd64, ext: "",      goos: darwin,  goarch: amd64 }
          - { os: darwin,  arch: arm64, ext: "",      goos: darwin,  goarch: arm64 }
          - { os: windows, arch: amd64, ext: ".exe",  goos: windows, goarch: amd64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o "nwafu-srun-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nwafu-srun-${{ matrix.os }}-${{ matrix.arch }}
          path: nwafu-srun-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
